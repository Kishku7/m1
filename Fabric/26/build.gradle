plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

base { archivesName = project.archives_base_name }

// Shared MC-coupled core (single source of truth).
sourceSets.main.java.srcDir "../../shared_minecraft/src/main/java"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly localRuntime("net.fabricmc:fabric-loader:${project.loader_version}")
    compileOnly localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
}

processResources {
    def packFormat = (System.getenv("PACK_FORMAT") ?: "88")
    inputs.properties(["version": project.version, "packFormat": packFormat])
    filesMatching("fabric.mod.json") { expand "version": project.version, "mcDep": project.mc_dep }
    // 26.x resource pack_format is > 81, so the strict datapack codec DEMANDS min_format/max_format;
    // a plain int FATALs NeoForge dedicated-server datapack load. Ship the exact-single range form,
    // value injected per 26.X by build-all (PACK_FORMAT env). See Memory/knowledge/pack-formats.md.
    filesMatching("pack.mcmeta") { expand "packFormat": packFormat }
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = "UTF-8"; it.options.release = 25; it.options.compilerArgs += ["-Xlint:all"] }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// AI_Brain (MC-agnostic resources, shipped in jar)
sourceSets.main.resources.srcDir "../../shared_common/src/main/resources"


sourceSets.main.java.srcDir "../../shared_common/src/main/java"

