plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
	id "legacy-looming" version "${loom_version}" // Version must match fabric-loom's
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	accessWidenerPath = file("src/main/resources/m1.accesswidener")
}

legacyLooming {
}

// The ONLY java source is the cog-generated gen/ tree (run scripts/cog-gen.ps1 first).
sourceSets {
	main {
		java {
			srcDirs = ["gen"]
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings(legacy.yarn(project.minecraft_version, project.yarn_build))
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.legacyfabric.legacy-fabric-api:legacy-fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"

	if (JavaVersion.current().isJava9Compatible()) {
		it.options.release = 8
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}
