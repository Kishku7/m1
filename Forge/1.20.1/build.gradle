plugins {
    id 'java'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.31'
    id 'net.minecraftforge.renamer' version '1.1.3'
}

version = "${mod_version}+${minecraft_version}-forge"
group = 'com.kishku7'

base {
    archivesName = 'm1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// FG7: plugins from the Gradle Plugin Portal. Mavenizer runs at config time on minecraft.dependency(...).
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

def mcDep = minecraft.dependency("net.minecraftforge:forge:${forge_version}")

dependencies {
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
    implementation mcDep
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // Forge 47.x (1.20.1 only) deprecates vanilla BuiltInRegistries.ITEM/ENTITY_TYPE in favor of
    // ForgeRegistries -- no cross-version replacement, so -deprecation is scoped OUT for this cell.
    options.compilerArgs += ['-Xlint:all,-deprecation']
}

// No mixins, no access transformer. ${file.jarVersion} in mods.toml resolves at runtime from the manifest.
jar {
    manifest {
        attributes 'Implementation-Version': project.mod_version
    }
}

// FG7 REOBF for MC 1.20.1 (<=1.20.4 = SRG runtime): apply net.minecraftforge.renamer, map the plain
// (mojmap) jar mojmap->SRG. renameJar emits the -srg jar, which is the PRODUCTION artifact on this cell.
// The renamer task declares a JDK 8 toolchain (see gradle.properties installations.paths) and is NOT
// configuration-cache serializable (see configuration-cache=false).
renamer {
    mappings.from mcDep.toSrgFile
    classes(tasks.named('jar')) {
        archiveClassifier = 'srg'
    }
}
tasks.named('assemble') { dependsOn 'renameJar' }

// SRG-RUNTIME FIX (2026-07-04): Forge 47.x / MC 1.20.1 runs SRG (f_xxxxx_ / m_xxxxx_) names at RUNTIME,
// so the reflection-by-mojmap *Compat facades in shared_minecraft MISS. Build from the cog-generated
// gen/ tree (DIRECT compiled MC access, which Forge remaps mojmap->SRG at load). Regenerate gen/ with:
//   ./cog-gen.ps1 -Cell Forge/1.20.1 -McVer 1.20.1 -Loader forge
// cog-gen bundles shared_minecraft + shared_common java into gen/; add only shared_common resources.
sourceSets.main.java.srcDir "gen"
sourceSets.main.resources.srcDir "../../shared_common/src/main/resources"
