plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}+${minecraft_version}-forge"
group = 'com.kishku7'

base {
    archivesName = 'm1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.11'
}

dependencies {
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
    minecraft "net.minecraftforge:forge:${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all']
}

// No mixins, no access transformer, so no refmap / AT manifest. ${file.jarVersion} in mods.toml
// resolves at runtime from the manifest. Forge 1.21.x runs Mojang mappings so reflection-by-mojmap
// *Compat facades resolve at runtime -- shared_minecraft is srcDir'd directly (no Cog/gen).
jar {
    manifest {
        attributes 'Implementation-Version': project.mod_version
    }
}

sourceSets.main.java.srcDir "../../shared_minecraft/src/main/java"
sourceSets.main.java.srcDir "gen"  // M1-Server Queries (cog-direct, per-MC) -- see cog-gen.ps1

// AI_Brain (MC-agnostic java + resources, shipped in jar)
sourceSets.main.java.srcDir "../../shared_common/src/main/java"
sourceSets.main.resources.srcDir "../../shared_common/src/main/resources"
