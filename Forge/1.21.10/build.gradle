plugins {
    id 'java'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.31'
}

version = "${mod_version}+${minecraft_version}-forge"
group = 'com.kishku7'

base {
    archivesName = 'm1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// FG7: plugins come from the Gradle Plugin Portal (no Forge-maven pluginManagement block).
// The Minecraft Mavenizer runs automatically at configuration time when minecraft.dependency(...)
// resolves (first run ~5-6 min: decompile+patch+recompile Forge into a local MC maven, cached after).
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
    // This cell runs a MOJMAP runtime -> no renamer; the plain jar is the production artifact.
    // M1 bundles no libraries, so no jarjar/JiJ is needed.
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all']
}

// No mixins, no access transformer, so no refmap / AT manifest. ${file.jarVersion} in mods.toml
// resolves at runtime from the manifest. Forge 1.21.x runs Mojang mappings so reflection-by-mojmap
// *Compat facades resolve at runtime -- shared_minecraft is srcDir'd directly (no Cog/gen).
// This 1.21.10 cell (forge 60.x, EventBus-7) claims MC [1.21.9,1.21.11): the 1.21.9 arm is a beta
// compat claim (no stable forge 1.21.9 exists to build against; the 1.21.10 jar serves it). The
// 1.21.11 Identifier rename is handled reflectively in M1Compat, so the ResourceLocation-era jar
// spans 1.21.9/1.21.10 without a direct binary reference to the renamed class.
jar {
    manifest {
        attributes 'Implementation-Version': project.mod_version
    }
}

sourceSets.main.java.srcDir "gen"  // M1-Server Queries (cog-direct, per-MC) -- see cog-gen.ps1

// AI_Brain (MC-agnostic java + resources, shipped in jar)
sourceSets.main.resources.srcDir "../../_codegen/cog_sources/shared_resources"
