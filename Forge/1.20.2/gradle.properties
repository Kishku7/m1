org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# FG7 needs Gradle 9.3+; run Gradle itself on JDK 21.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.9.10-hotspot
# The FG7 renamer task declares a JDK 8 toolchain. Gradle auto-detects the Adoptium 17/21 JDKs in
# Program Files; the non-standard JDK 8 location is provided per-machine via the developer's global
# ~/.gradle/gradle.properties (org.gradle.java.installations.paths) so NO absolute user-home path is
# committed here. auto-download is off (its Windows extract of JDK 8 fails).
org.gradle.java.installations.auto-download=false
# RenameJar is not configuration-cache serializable.
org.gradle.configuration-cache=false

