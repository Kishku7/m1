plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}+${minecraft_version}-forge"
group = 'com.kishku7'

base {
    archivesName = 'm1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.4'
}

dependencies {
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
    minecraft "net.minecraftforge:forge:${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // Forge 47.x (1.20.1 only) deprecates vanilla BuiltInRegistries.ITEM/ENTITY_TYPE in favor of
    // ForgeRegistries (Forge-only, cannot live in shared source) -- no cross-version replacement,
    // so -deprecation is scoped OUT for this single cell; -Xlint:all otherwise holds.
    options.compilerArgs += ['-Xlint:all,-deprecation']
}

// No mixins, no access transformer. ${file.jarVersion} in mods.toml resolves at runtime from the manifest.
jar {
    manifest {
        attributes 'Implementation-Version': project.mod_version
    }
}

// SRG-RUNTIME FIX (2026-07-04): Forge 47.x / MC 1.20.1 runs SRG (f_xxxxx_ / m_xxxxx_) names at RUNTIME,
// so the reflection-by-mojmap *Compat facades in shared_minecraft MISS (M1Compat.screen() returned null
// -> the client smoketest hung at screen=none, never entered the world). This is the SAME failure mode as
// pre-26 Fabric (intermediary runtime). Fall through to Cog/direct: build from the cog-generated gen/ tree
// (DIRECT compiled MC access, which Forge remaps mojmap->SRG at load). Regenerate gen/ with:
//   ./cog-gen.ps1 -Cell Forge/1.20.1 -McVer 1.20.1 -Loader forge
// cog-gen robocopies shared_minecraft + shared_common java into gen/ then overwrites the *Compat classes
// with cog'd direct versions -- so gen/ already bundles shared_common java; add only its resources srcDir.
sourceSets.main.java.srcDir "gen"
sourceSets.main.resources.srcDir "../../_codegen/cog_sources/shared_resources"
