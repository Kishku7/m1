org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_version=0.17.4
# minecraft_version / neo_version / neoforge_range / mc_range below are the BARE-BUILD DEFAULTS only:
# a plain 'gradlew build' here yields a single 26.1 jar. The canonical multi-26.X build is
# scripts/build-all-neoforge.ps1, which OVERRIDES these per 26.X via -P (26.1 -> pf 84, 26.2 -> pf 88,
# 26.3 -> pf 97). MDG must stay >= 2.0.147: 2.0.140/2.0.141 cannot build NeoForge 26.3 at all -- they
# die recompiling Minecraft's own sources before any mod code compiles.
# Always build the 26 cell through build-all. See minecraft/version-gates.md (NeoForge 26.x PINNED).
minecraft_version=26.1.2
moddevgradle_version=2.0.147
neo_version=26.1.2.87
neoforge_range=[26.1.0-alpha,)
mc_range=[26.1,26.2)
